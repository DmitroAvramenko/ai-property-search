<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Property Search</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0d110f; --ui:#f2f5f0; --muted:#8a9a90; --accent:#68de1f; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ui); font-family:'IBM Plex Sans', Arial, sans-serif; }
  body { min-height:100vh; }

  /* toolbar */
  .bar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px; padding:12px 24px;
         background:rgba(13,17,15,.92); backdrop-filter:blur(8px); border-bottom:1px solid #1f2a23; }
  .bar .dot { width:18px; height:18px; border-radius:50%; background:linear-gradient(120deg,#68de1f,#3bd27f,#1bc9c2); }
  .bar .title { font-weight:600; font-size:15px; }
  .bar .sp { flex:1; }
  .bar button { font:600 14px 'IBM Plex Sans', Arial, sans-serif; border:0; border-radius:999px; padding:9px 18px; cursor:pointer; }
  .bar .present { background:#ffb70e; color:#241a02; }
  .bar .hint { color:var(--muted); font-size:13px; }
  .bar .lang { display:flex; gap:4px; }
  .bar .lang a { font:600 13px 'IBM Plex Sans', Arial, sans-serif; color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:999px; border:1px solid #2b3830; }
  .bar .lang a.on { color:#111613; background:var(--accent); border-color:var(--accent); }

  /* review mode: all slides stacked */
  .deck { max-width:1280px; margin:0 auto; padding:24px 24px 80px; display:flex; flex-direction:column; gap:28px; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border-radius:10px;
           box-shadow:0 10px 40px rgba(0,0,0,.45); cursor:pointer; }
  .frame .num { position:absolute; left:-2px; top:-26px; font-size:13px; color:var(--muted); }
  .wrap { position:relative; }
  .stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }

  /* present mode */
  body.presenting .bar, body.presenting .deck { display:none; }
  .show { display:none; position:fixed; inset:0; background:#000; align-items:center; justify-content:center; }
  body.presenting .show { display:flex; }
  .show .frame { width:min(100vw, calc(100vh * 16 / 9)); border-radius:0; box-shadow:none; cursor:default; }
  .show .counter { position:fixed; right:18px; bottom:12px; font-size:13px; color:#6a776f; }

  /* ---- slide subset defaults (match the Slides format) ---- */
  .stage section { position:relative; width:1920px; height:1080px; overflow:hidden; display:flex; flex-direction:column;
                   font-family:'IBM Plex Sans', Arial, sans-serif; color:#262b28; }
  .stage div { display:flex; flex-direction:column; }
  .stage h1, .stage h2, .stage h3, .stage p, .stage ul, .stage ol { margin:0; }
  .stage h1 { font-size:96px; font-weight:600; line-height:1.1; }
  .stage h2 { font-size:64px; font-weight:600; line-height:1.15; }
  .stage h3 { font-size:44px; font-weight:600; line-height:1.2; }
  .stage p, .stage li { font-size:32px; line-height:1.4; }
  .stage img { display:block; }
  .stage aside { display:none; }
  .stage svg { display:block; }
  .stage .icon svg { width:100%; height:100%; }
</style>
</head>
<body>
<div class="bar">
  <div class="dot"></div><div class="title" id="deckTitle">AI Property Search</div>
  <div class="sp"></div>
  <span class="hint" id="hint">Click a slide or press P to present. Arrows to navigate, Esc to exit.</span>
  <div class="lang"><a href="./" id="langEn">EN</a><a href="./?lang=uk" id="langUk">UA</a></div>
  <button class="present" id="presentBtn">Present</button>
</div>
<main class="deck" id="deck"></main>
<div class="show" id="show"><div class="frame" id="showFrame"><div class="stage" id="showStage"></div></div><div class="counter" id="counter"></div></div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" integrity="sha384-hJnF5AwidE18GSWTAGHv3ByzzvfNZ1Tcx5y1UUV3WkauuMCEzBJBMSwSt/PUPXnM" crossorigin="anonymous"></script>
<script>
// x-icon names used by the Slides format -> Lucide icon names
const ICONS = { Activity:'activity', Book:'book-open', Chart:'chart-column', Chat:'message-circle', Check:'check',
  CheckCircle:'circle-check', Clock:'clock', Cloud:'cloud', Code:'code', Database:'database', Globe:'globe',
  GraduationCap:'graduation-cap', Home:'house', Key:'key-round', Lightbulb:'lightbulb', Lightning:'zap', Link:'link',
  Lock:'lock', PaperPlane:'send', Play:'play', Search:'search', Settings:'settings', Star:'star', ThumbsUp:'thumbs-up',
  Tool:'hammer', Trust:'shield-check', Users:'users', Verified:'badge-check', Warning:'triangle-alert', Wrench:'wrench' };

const ARROWS = {
  'arrow-right':'polygon(0 30%, 60% 30%, 60% 0, 100% 50%, 60% 100%, 60% 70%, 0 70%)',
  'arrow-left':'polygon(100% 30%, 40% 30%, 40% 0, 0 50%, 40% 100%, 40% 70%, 100% 70%)',
  'arrow-up':'polygon(30% 100%, 30% 40%, 0 40%, 50% 0, 100% 40%, 70% 40%, 70% 100%)',
  'arrow-down':'polygon(30% 0, 30% 60%, 0 60%, 50% 100%, 100% 60%, 70% 60%, 70% 0)',
  'diamond':'polygon(50% 0, 100% 50%, 50% 100%, 0 50%)' };

function upgrade(root) {
  root.querySelectorAll('x-icon').forEach(el => {
    const d = document.createElement('div');
    d.className = 'icon';
    d.setAttribute('style', (el.getAttribute('style') || '') + ';display:block;flex:none');
    const i = document.createElement('i');
    i.setAttribute('data-lucide', ICONS[el.getAttribute('name')] || 'circle');
    d.appendChild(i);
    el.replaceWith(d);
  });
  root.querySelectorAll('x-shape').forEach(el => {
    const d = document.createElement('div');
    const kind = el.getAttribute('kind') || 'rect';
    let st = (el.getAttribute('style') || '') + ';display:block;flex:none';
    if (ARROWS[kind]) st += ';clip-path:' + ARROWS[kind];
    if (kind === 'ellipse') st += ';border-radius:50%';
    if (kind === 'rounded') st += ';border-radius:16px';
    d.setAttribute('style', st);
    el.replaceWith(d);
  });
  root.querySelectorAll('[style*="background-clip"]').forEach(el => {
    if (/background-clip:\s*text/.test(el.getAttribute('style'))) el.style.webkitBackgroundClip = 'text';
  });
  if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } });
}

// ?lang=uk -> Ukrainian copy of the deck in project-uk/
const UK = new URLSearchParams(location.search).get('lang') === 'uk';
const ROOT = UK ? 'project-uk' : 'project';
document.getElementById(UK ? 'langUk' : 'langEn').classList.add('on');
if (UK) {
  document.documentElement.lang = 'uk';
  document.getElementById('hint').textContent = 'Клік по слайду або P - показ. Стрілки - навігація, Esc - вихід.';
  document.getElementById('presentBtn').textContent = 'Показ';
}

let slides = [];
let current = 0;

function fit(frame) {
  const stage = frame.querySelector('.stage');
  stage.style.transform = 'scale(' + (frame.clientWidth / 1920) + ')';
}
function fitAll() { document.querySelectorAll('.frame').forEach(fit); }

function show(n) {
  current = Math.max(0, Math.min(slides.length - 1, n));
  const stage = document.getElementById('showStage');
  stage.innerHTML = slides[current];
  upgrade(stage);
  document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;
  history.replaceState(null, '', '#' + (current + 1));
  fit(document.getElementById('showFrame'));
}
function present(n) {
  document.body.classList.add('presenting');
  show(n);
  const el = document.documentElement;
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}
function exitPresent() {
  document.body.classList.remove('presenting');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const f = document.querySelectorAll('.deck .frame')[current];
  if (f) f.scrollIntoView({ block: 'center' });
  fitAll();
}

document.addEventListener('keydown', e => {
  const on = document.body.classList.contains('presenting');
  if (!on && (e.key === 'p' || e.key === 'P')) return present(current);
  if (!on) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); show(current + 1); }
  if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); show(current - 1); }
  if (e.key === 'Home') show(0);
  if (e.key === 'End') show(slides.length - 1);
  if (e.key === 'Escape') exitPresent();
});
document.getElementById('show').addEventListener('click', e => {
  show(current + (e.clientX > window.innerWidth / 3 ? 1 : -1));
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('presenting')) exitPresent();
});
document.getElementById('presentBtn').onclick = () => present(current);
window.addEventListener('resize', () => { fitAll(); if (document.body.classList.contains('presenting')) fit(document.getElementById('showFrame')); });

async function load() {
  const bust = '?v=' + Date.now();
  const deck = await (await fetch(ROOT + '/deck.json' + bust)).json();
  document.title = deck.title || document.title;
  document.getElementById('deckTitle').textContent = deck.title || '';
  for (const f of Object.values(deck.faces || {})) {
    if (f.href) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = f.href; document.head.appendChild(l); }
  }
  slides = await Promise.all(deck.order.map(async id => {
    const r = await fetch(ROOT + '/slides/' + id + '.html' + bust);
    return r.ok ? await r.text() : '<section style="background:#fff"><p>Missing slide: ' + id + '</p></section>';
  }));
  const deckEl = document.getElementById('deck');
  slides.forEach((html, i) => {
    const frame = document.createElement('div');
    frame.className = 'frame';
    frame.innerHTML = '<div class="stage">' + html + '</div>';
    const wrap = document.createElement('div');
    wrap.className = 'wrap';
    wrap.innerHTML = '<div class="num" style="position:absolute;top:-22px;font-size:13px;color:#8a9a90">' + (i + 1) + '</div>';
    wrap.appendChild(frame);
    frame.onclick = () => present(i);
    deckEl.appendChild(wrap);
    upgrade(frame);
  });
  fitAll();
  document.fonts && document.fonts.ready.then(fitAll);
  const h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= slides.length) {
    current = h - 1;
    const f = document.querySelectorAll('.deck .frame')[current];
    if (f) f.scrollIntoView({ block: 'center' });
  }
}
load();
</script>
</body>
</html>
