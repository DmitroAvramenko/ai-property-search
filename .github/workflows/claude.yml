name: Claude edits

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write

concurrency:
  group: claude-edits
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Claude commits to its own branch; publish the change by merging it into main.
      - name: Merge Claude's branch into main and redeploy
        if: always() && steps.claude.outputs.branch_name != ''
        env:
          BR: ${{ steps.claude.outputs.branch_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git fetch origin "$BR"; then echo "Branch $BR not found, nothing to merge"; exit 0; fi
          if [ -z "$(git rev-list "origin/main..origin/$BR")" ]; then
            echo "No new commits on $BR"
          else
            git checkout -B main origin/main
            git merge --no-edit "origin/$BR"
            git push origin main
            gh workflow run pages.yml --ref main
          fi
          git push origin --delete "$BR" || true
